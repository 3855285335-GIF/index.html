<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatter 代码审查包</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); background: #0f0d17; color: #e9e6f2; font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 19px; margin: 2px 0 4px; }
  .sub { color: #9a94ad; font-size: 12.5px; margin-bottom: 14px; }
  .how { background: #171326; border: 1px solid #2a243d; border-radius: 14px; padding: 11px 13px; font-size: 12.5px; color: #b3abc8; margin-bottom: 16px; }
  .how b { color: #e9e6f2; }
  .card { background: #191527; border: 1px solid #2a243d; border-radius: 14px; padding: 12px 13px; margin-bottom: 10px; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .idx { font-size: 11px; color: #7c5cff; font-weight: 700; min-width: 18px; }
  .name { font-size: 14.5px; font-weight: 600; flex: 1; }
  .kb { font-size: 11px; color: #8b84a0; }
  .meta { color: #9a94ad; font-size: 12px; margin: 3px 0 0 26px; }
  .row { display: flex; gap: 8px; margin: 9px 0 0 26px; }
  a.btn, button.btn { flex: 1; text-align: center; padding: 9px 6px; border-radius: 11px; background: #2a243d; color: #cfc7e6; text-decoration: none; font-size: 13px; border: 0; font-family: inherit; }
  a.btn.main { background: #7c5cff; color: #fff; font-weight: 600; }
  .ok { color: #6ee7a8; }
</style>
</head>
<body>
  <h1>Chatter 代码审查包</h1>
  <div class="sub">当前线上版本：526477 字节（main abf4de35，2026-11-13）。按风险排序，一次喂一个文件。</div>

  <div class="how">
    <b>省额度用法：</b>每个文件单独发一条消息，只让它审这一个；每 2–3 个文件换新对话，把上一轮结论贴过去。<br>
    <b>先看 1、2、3、4</b>（SQL / 消息核心 / 事件绑定 / 群聊），样式放最后。
  </div>

  <div id="list"></div>

<script>
const items = [
  ['数据库结构（表 + RLS + 函数 + 触发器）', 'schema.md', '23 KB', '所有权限边界'],
  ['全部 SQL 补丁（含最新安全/免打扰）', 'all-sql.sql', '87 KB', '和 schema 对照'],
  ['消息核心', 'code/parts/03-消息核心.txt', '90 KB', '发送/实时/撤回/已读/缺口'],
  ['事件绑定', 'code/parts/13-事件绑定.txt', '49 KB', '所有点击/监听'],
  ['群聊', 'code/parts/07-群聊.txt', '36 KB', '建群/邀请/审批/公告/群文件'],
  ['好友通话群语音', 'code/parts/04-好友通话群语音.txt', '46 KB', '信令/群语音'],
  ['媒体与视频编辑', 'code/parts/10-媒体与视频编辑.txt', '43 KB', '表情/视频/文件'],
  ['朋友圈', 'code/parts/08-朋友圈.txt', '23 KB', '可见性/点赞/访客'],
  ['登录与账号', 'code/parts/06-登录与账号.txt', '23 KB', '登录/资料/背景'],
  ['查看器与通知', 'code/parts/12-查看器与通知.txt', '21 KB', '图片查看/通知/推送'],
  ['配置与工具', 'code/parts/02-配置与工具.txt', '18 KB', 'esc/工具/状态'],
  ['实时与降级', 'code/parts/05-实时与降级.txt', '13 KB', '重连/轮询'],
  ['好友资料与存储', 'code/parts/11-好友资料与存储.txt', '14 KB', '备注/资料卡'],
  ['多选与导出', 'code/parts/09-多选与导出.txt', '12 KB', '多选/导出'],
  ['启动', 'code/parts/14-启动.txt', '2 KB', '初始化'],
  ['页面结构与样式', 'code/parts/01-页面结构与样式.txt', '124 KB', 'CSS/结构（最后看）']
];
const list = document.getElementById('list');
items.forEach(function (it, i) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<div class="top"><span class="idx">' + (i + 1) + '</span><span class="name">' + it[0] + '</span><span class="kb">' + it[2] + '</span></div>' +
    '<div class="meta">' + it[3] + '</div>' +
    '<div class="row"><a class="btn main" href="' + it[1] + '" target="_blank" rel="noopener">打开</a><button class="btn" data-copy="' + it[1] + '">复制全文</button></div>';
  list.appendChild(d);
});
document.querySelectorAll('[data-copy]').forEach(function (b) {
  b.onclick = async function () {
    const old = b.textContent;
    try {
      const r = await fetch(b.dataset.copy, { cache: 'no-store' });
      const t = await r.text();
      await navigator.clipboard.writeText(t);
      b.textContent = '已复制 ✓'; b.classList.add('ok');
    } catch (e) { b.textContent = '复制失败，点“打开”'; }
    setTimeout(function () { b.textContent = old; b.classList.remove('ok'); }, 2200);
  };
});
</script>
</body>
</html>
