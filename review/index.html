<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatter 代码审查包</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); background: #0f0d17; color: #e9e6f2; font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 19px; margin: 2px 0 4px; }
  .sub { color: #9a94ad; font-size: 12.5px; margin-bottom: 14px; }
  .how { background: #171326; border: 1px solid #2a243d; border-radius: 14px; padding: 11px 13px; font-size: 12.5px; color: #b3abc8; margin-bottom: 16px; }
  .how b { color: #e9e6f2; }
  .card { background: #191527; border: 1px solid #2a243d; border-radius: 14px; padding: 12px 13px; margin-bottom: 10px; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .idx { font-size: 11px; color: #7c5cff; font-weight: 700; min-width: 18px; }
  .name { font-size: 14.5px; font-weight: 600; flex: 1; }
  .kb { font-size: 11px; color: #8b84a0; }
  .meta { color: #9a94ad; font-size: 12px; margin: 3px 0 0 26px; }
  .row { display: flex; gap: 8px; margin: 9px 0 0 26px; }
  a.btn, button.btn { flex: 1; text-align: center; padding: 9px 6px; border-radius: 11px; background: #2a243d; color: #cfc7e6; text-decoration: none; font-size: 13px; border: 0; font-family: inherit; }
  a.btn.main { background: #7c5cff; color: #fff; font-weight: 600; }
  .ok { color: #6ee7a8; }
  h2 { font-size: 14px; color: #b3abc8; margin: 22px 2px 8px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Chatter 代码审查包</h1>
  <div class="sub">按「风险从高到低」排的顺序，一次只喂一个文件，省额度。</div>

  <div class="how">
    <b>省额度用法：</b>每个文件单独发一条消息，让 Claude 只审这一个；每 2–3 个文件换一个新对话，把上一轮的发现贴过去当上下文。<br>
    <b>先看 1、2、3、4</b>（SQL + 消息核心 + 事件绑定 + 群聊），这四块占了大部分风险；<b>01 样式</b>放最后，可以不看。
  </div>

  <div id="list"></div>

<script>
const items = [
  ['数据库结构（表 + 全部 RLS 策略 + 函数 + 触发器）', 'schema.md', '23 KB', '先看这个：所有权限边界都在这里'],
  ['全部 SQL 补丁（按执行顺序）', 'all-sql.sql', '80 KB', '和 schema.md 对照着看，确认没有漏掉的策略'],
  ['消息核心', 'parts/03-消息核心.txt', '68 KB', '发送 deliver、实时 onDbMsg、@提醒、撤回、已读；重点查竞态和重复'],
  ['事件绑定', 'parts/13-事件绑定.txt', '47 KB', '所有 onclick/监听；重点查空元素、重复绑定、未清理监听'],
  ['群聊', 'parts/07-群聊.txt', '35 KB', '建群、邀请、审批、公告、群文件、退群；重点查权限和并发'],
  ['朋友圈', 'parts/08-朋友圈.txt', '23 KB', '发布、可见性、点赞评论、访客；重点查越权'],
  ['好友 / 通话 / 群语音', 'parts/04-好友通话群语音.txt', '46 KB', '好友关系、1 对 1 信令、4 人群语音；重点查信令竞态'],
  ['实时与降级', 'parts/05-实时与降级.txt', '13 KB', 'Realtime 重连、轮询兜底；重点查重复渲染'],
  ['媒体与视频编辑', 'parts/10-媒体与视频编辑.txt', '43 KB', '表情、视频裁剪/压缩、文件；重点查 MediaRecorder 和内存'],
  ['登录与账号', 'parts/06-登录与账号.txt', '23 KB', '登录/注册/启动、草稿、背景、错误上报'],
  ['查看器与通知', 'parts/12-查看器与通知.txt', '22 KB', '图片查看器、引用跳转、系统通知、Web Push'],
  ['多选与导出', 'parts/09-多选与导出.txt', '12 KB', '多选转发、导出、清空、搜索'],
  ['好友资料与存储', 'parts/11-好友资料与存储.txt', '14 KB', '备注、资料卡、上传进度、存储提醒'],
  ['配置与工具', 'parts/02-配置与工具.txt', '39 KB', '配置、esc、工具函数、全局状态'],
  ['页面结构与样式', 'parts/01-页面结构与样式.txt', '122 KB', 'HTML + CSS；最后看，主要是样式覆盖问题'],
  ['启动', 'parts/14-启动.txt', '2 KB', '初始化、定时器']
];
const list = document.getElementById('list');
items.forEach(function (it, i) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<div class="top"><span class="idx">' + (i + 1) + '</span><span class="name">' + it[0] + '</span><span class="kb">' + it[2] + '</span></div>' +
    '<div class="meta">' + it[3] + '</div>' +
    '<div class="row"><a class="btn main" href="' + it[1] + '" target="_blank" rel="noopener">打开</a><button class="btn" data-copy="' + it[1] + '">复制全文</button></div>';
  list.appendChild(d);
});
document.querySelectorAll('[data-copy]').forEach(function (b) {
  b.onclick = async function () {
    const old = b.textContent;
    try {
      const r = await fetch(b.dataset.copy, { cache: 'no-store' });
      const t = await r.text();
      await navigator.clipboard.writeText(t);
      b.textContent = '已复制 ✓'; b.classList.add('ok');
    } catch (e) { b.textContent = '复制失败，点“打开”'; }
    setTimeout(function () { b.textContent = old; b.classList.remove('ok'); }, 2200);
  };
});
</script>
</body>
</html>
