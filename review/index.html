<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatter 代码审查包</title>
<style>
 body{margin:0;padding:18px 14px 40px;background:#0f0d17;color:#e9e6f2;font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
 h1{font-size:19px;margin:0 0 4px}.sub{color:#9a94ad;font-size:12.5px;margin-bottom:14px}
 .how{background:#171326;border:1px solid #2a243d;border-radius:14px;padding:11px 13px;font-size:12.5px;color:#b3abc8;margin-bottom:16px}
 .card{background:#191527;border:1px solid #2a243d;border-radius:14px;padding:12px 13px;margin-bottom:10px}
 .top{display:flex;align-items:baseline;gap:8px}.idx{font-size:11px;color:#7c5cff;font-weight:700;min-width:18px}
 .name{font-size:14.5px;font-weight:600;flex:1}.kb{font-size:11px;color:#8b84a0}
 .meta{color:#9a94ad;font-size:12px;margin:3px 0 0 26px}
 .row{display:flex;gap:8px;margin:9px 0 0 26px}
 a.btn,button.btn{flex:1;text-align:center;padding:9px 6px;border-radius:11px;background:#2a243d;color:#cfc7e6;text-decoration:none;font-size:13px;border:0;font-family:inherit}
 a.btn.main{background:#7c5cff;color:#fff;font-weight:600}
</style></head><body>
<h1>Chatter 代码审查包</h1>
<div class="sub">线上版本：542019 字节（2026-11-15），main a9846abe。按风险排序，一次喂一个文件。</div>
<div class="how"><b>本轮改动</b>：图片压到 1280/80%、视频上限 20MB、清理旧推送日志/信令、iOS 缓存 blob、已读以 peer_read 为准、轮询自适应、多选复制、气泡皮肤、通讯录字母分组、置顶/免打扰跨设备。<br><br><b>省额度：</b>每个文件单独发一条消息；先看 1、2、3、4。</div>
<div id="list"></div>
<script>
const items=[["数据库结构（表 + RLS + 函数 + 触发器）","schema.md","24 KB","所有权限边界"],
["全部 SQL 补丁","all-sql.sql","94 KB","含 retention-v1"],
["消息核心","code/parts/03-消息核心.txt","94 KB","发送/实时/撤回/已读/缺口/图片占位"],
["事件绑定","code/parts/13-事件绑定.txt","52 KB","点击/监听/多选/输入法"],
["好友通话群语音","code/parts/04-好友通话群语音.txt","46 KB","信令/群语音"],
["媒体与视频编辑","code/parts/10-媒体与视频编辑.txt","46 KB","表情/视频/文件/保存"],
["群聊","code/parts/07-群聊.txt","36 KB","建群/邀请/审批/公告/群文件"],
["朋友圈","code/parts/08-朋友圈.txt","24 KB","可见性/点赞/访客/私密"],
["登录与账号","code/parts/06-登录与账号.txt","23 KB","登录/资料/背景"],
["查看器与通知","code/parts/12-查看器与通知.txt","22 KB","图片查看/通知/推送"],
["配置与工具","code/parts/02-配置与工具.txt","18 KB","esc/工具/状态"],
["好友资料与存储","code/parts/11-好友资料与存储.txt","14 KB","备注/资料卡"],
["实时与降级","code/parts/05-实时与降级.txt","13 KB","重连/轮询"],
["多选与导出","code/parts/09-多选与导出.txt","12 KB","多选/复制/导出"],
["启动","code/parts/14-启动.txt","3 KB","初始化"],
["页面结构与样式","code/parts/01-页面结构与样式.txt","127 KB","CSS/结构（最后看）"]];
const list=document.getElementById("list");
items.forEach(function(it,i){const d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="top"><span class="idx">'+(i+1)+'</span><span class="name">'+it[0]+'</span><span class="kb">'+it[2]+'</span></div><div class="meta">'+it[3]+'</div><div class="row"><a class="btn main" href="'+it[1]+'" target="_blank">打开</a></div>';
 list.appendChild(d);});
</script></body></html>
