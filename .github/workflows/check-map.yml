name: check-map
# 手动运行：在 GitHub 的服务器上实测天地图（图块、搜地点、算路线）和 B 站（搜索、播放器能不能嵌入）的真实返回。
# 天地图密钥从数据库的公开配置 app_config.navigation 里读（和手机读的是同一个），日志里打码，不存任何东西。
on: workflow_dispatch
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    env:
      SB: https://uaoiqbxptnbrvkzjwguc.supabase.co
      ANON: sb_publishable_2FQ9q01lGWiDntr7VUrzcQ_SkgIo8uf
      REF: https://3855285335-gif.github.io/
      ORIGIN: https://3855285335-gif.github.io
    steps:
      - name: 服务器（东京）上用数据库里的密钥实测天地图（自检接口，密钥打码）
        run: |
          curl -sS -m 60 -X POST "$SB/functions/v1/chatter-search" -H 'Content-Type: application/json' -d '{"op":"ping","probe":"map"}' -o p.json
          python3 -c '
          import json
          d=json.load(open("p.json")); print("版本", d.get("v")); m=d.get("map") or {}
          for k,v in m.items(): print(k, "=>", json.dumps(v, ensure_ascii=False)[:900])
          '
      - name: 服务器（东京）上试高德（自检接口，只回状态）
        run: |
          curl -sS -m 60 -X POST "$SB/functions/v1/chatter-search" -H 'Content-Type: application/json' -d '{"op":"ping","probe":"amap"}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print("版本", d.get("v")); print(json.dumps(d.get("amap"), ensure_ascii=False, indent=1))'
      - name: 服务器（东京）上搜 B 站（自检接口）
        run: |
          curl -sS -m 60 -X POST "$SB/functions/v1/chatter-search" -H 'Content-Type: application/json' -d '{"op":"ping","probe":"bili"}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print("版本", d.get("v"), "B 站：", json.dumps(d.get("bili"), ensure_ascii=False))'
      - name: GitHub（美国）上不带密钥看天地图接口的跨域头和报错格式
        run: |
          for u in "https://api.tianditu.gov.cn/v2/search?postStr=%7B%22keyWord%22%3A%22a%22%7D&type=query&tk=0000" "https://api.tianditu.gov.cn/drive?postStr=%7B%7D&type=search&tk=0000" "https://t0.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX=15&TILEROW=12416&TILECOL=26979&tk=0000"; do
            echo "== $u"; curl -sS -m 25 -o r.txt -D h.txt -w 'HTTP %{http_code} %{content_type}\n' -H "Origin: $ORIGIN" -H "Referer: $REF" "$u" || true
            grep -iE '^(access-control|server|cache-control)' h.txt || true; head -c 400 r.txt; echo
          done
          echo "== 预检请求（OPTIONS）"; curl -sS -m 25 -o /dev/null -D - -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' "https://api.tianditu.gov.cn/v2/search" | grep -iE '^(HTTP|access-control)' || true
      - name: 步行、骑行（routing.openstreetmap.de）
        run: |
          for p in foot bike car; do curl -sS -m 25 -o r.json -D h.txt -w "$p HTTP %{http_code}\n" -H "Origin: $ORIGIN" "https://routing.openstreetmap.de/routed-$p/route/v1/driving/116.3975,39.9087;116.3786,39.8651?overview=false&steps=true"; grep -i access-control h.txt; python3 -c 'import json; d=json.load(open("r.json")); r=d["routes"][0]; s=r["legs"][0]["steps"]; print("距离",r["distance"],"时间",r["duration"],"步数",len(s)); [print(" ",x["maneuver"]["type"],x["maneuver"].get("modifier"),x.get("name"),round(x["distance"])) for x in s[:6]]'; done
  bili:
    runs-on: ubuntu-latest
    steps:
      - name: B 站：搜索接口、视频信息、播放器能不能嵌入
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "== 不带饼干直接搜"; curl -sS -m 20 -G -A "$UA" "https://api.bilibili.com/x/web-interface/search/type" --data-urlencode "search_type=video" --data-urlencode "keyword=晴天 周杰伦" | head -c 400; echo
          echo "== 先拿访客饼干再搜"; curl -sS -m 20 -A "$UA" -c jar.txt -o /dev/null https://www.bilibili.com/ ; grep -o 'buvid3\s*[^ ]*' jar.txt | cut -c1-20
          curl -sS -m 20 -G -A "$UA" -b jar.txt -e https://www.bilibili.com/ "https://api.bilibili.com/x/web-interface/search/type" --data-urlencode "search_type=video" --data-urlencode "keyword=晴天 周杰伦" --data-urlencode "page=1" -o s.json -w 'HTTP %{http_code}\n'
          python3 -c '
          import json,re
          d=json.load(open("s.json")); print("code",d.get("code"),d.get("message"))
          r=(d.get("data") or {}).get("result") or []
          print("条数",len(r), "字段", sorted(r[0].keys()) if r else None)
          for x in r[:6]: print(x.get("bvid"), x.get("duration"), x.get("play"), re.sub("<[^>]+>","",x.get("title",""))[:40], x.get("author"), (x.get("pic") or "")[:60], x.get("typename"))
          ' || head -c 600 s.json
          BV=$(python3 -c 'import json; r=json.load(open("s.json"))["data"]["result"]; print(r[0]["bvid"])' 2>/dev/null || echo BV1fK4y1q79u)
          echo "== 视频信息 $BV"; curl -sS -m 20 -A "$UA" -b jar.txt -e https://www.bilibili.com/ "https://api.bilibili.com/x/web-interface/view?bvid=$BV" | python3 -c 'import sys,json; d=json.load(sys.stdin); v=d.get("data") or {}; print(d.get("code"), v.get("title"), v.get("duration"), v.get("cid"), (v.get("pic") or "")[:70], "分P", len(v.get("pages") or []), "rights", v.get("rights"))'
          echo "== 播放器页面的嵌入限制"; curl -sS -m 20 -A "$UA" -o p.html -D - "https://player.bilibili.com/player.html?bvid=$BV&autoplay=0" | grep -iE '^(HTTP|x-frame-options|content-security-policy|location)' | cut -c1-300
          echo "== 手机身份的播放器"; curl -sS -m 20 -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148' -o /dev/null -D - "https://player.bilibili.com/player.html?bvid=$BV&autoplay=1&high_quality=1" | grep -iE '^(HTTP|x-frame-options|content-security-policy|location)' | cut -c1-300
          echo "== 接口的跨域头"; curl -sS -m 20 -o /dev/null -D - -A "$UA" -b jar.txt -H 'Origin: https://3855285335-gif.github.io' "https://api.bilibili.com/x/web-interface/view?bvid=$BV" | grep -i 'access-control' || echo 没有
          echo "== 搜索建议（不用饼干）"; curl -sS -m 20 -G -A "$UA" "https://s.search.bilibili.com/main/suggest" --data-urlencode "term=晴天" | head -c 300; echo
          echo "== 音乐区排行"; curl -sS -m 20 -A "$UA" -b jar.txt "https://api.bilibili.com/x/web-interface/ranking/v2?rid=3&type=all" | python3 -c 'import sys,json; d=json.load(sys.stdin); l=(d.get("data") or {}).get("list") or []; print(d.get("code"), len(l), [x.get("title","")[:20] for x in l[:5]])' || true
          echo "== 封面图（不带来源网址）"; P=$(curl -sS -m 20 -A "$UA" -b jar.txt -e https://www.bilibili.com/ "https://api.bilibili.com/x/web-interface/view?bvid=$BV" | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"]["pic"])'); curl -sS -m 20 -o /dev/null -w '%{http_code} %{content_type}\n' "$P"; curl -sS -m 20 -o /dev/null -w '带外站来源 %{http_code} %{content_type}\n' -e https://3855285335-gif.github.io/ "$P"
          echo "== 小封面（@160w_100h_1c.jpg）"; curl -sS -m 20 -o /dev/null -w '%{http_code} %{content_type} %{size_download} 字节\n' "$P@160w_100h_1c.jpg"; curl -sS -m 20 -o /dev/null -w '原图 %{size_download} 字节\n' "$P"
