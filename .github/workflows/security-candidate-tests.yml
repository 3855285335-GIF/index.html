name: Chatter 安全候选自动检查
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'navigation.html'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase/rollback/**'
      - 'review/security/**'
      - '.github/workflows/security-candidate-tests.yml'
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 代码语法检查
        run: |
          node --check app.js
          node --check search.js
          node --check navigation.js
          node --check tests/run.js
          node --check tests/harness.js
          node --check tests/private-photo-browser.js
          node --check tests/security-anon-check.cjs
      - name: 安装隔离测试依赖（不连接生产环境）
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electric-sql/pglite@0.2.17
      - name: 前端全量回归
        working-directory: tests
        run: npm test
      - name: 私密附件与联系人设置数据库回归
        working-directory: tests
        run: |
          node sql-private-attachments-test.mjs
          node sql-contacts-only-test.mjs
          node security-anon-check.cjs
          node sql-anon-function-grants-test.mjs

  sql-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装数据库模拟依赖
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @electric-sql/pglite@0.2.17
      - name: 旧版数据库迁移与权限回归
        working-directory: tests
        run: |
          node sql-1117-test.mjs
          node sql-1118-search-test.mjs
          node sql-moment-privacy-test.mjs
          node sql-revoke-old-rpcs-test.mjs
          node sql-chatter-repair-test.mjs
          node sql-navigation-test.mjs

  chromium-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装浏览器测试依赖
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: 启动、离线缓存、浏览器回归
        working-directory: tests
        run: |
          node start-test.js
          node sw-test.js
          node sw-cache-failure.cjs
          node search-ui.js
      - name: 音乐和导航模拟浏览器回归
        working-directory: tests
        run: |
          node music-ui.js
          node navigation-ui.cjs

  edge-functions-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 服务器函数隔离测试（供应商、推送和数据库均使用测试替身）
        working-directory: tests
        run: |
          deno run -A --node-modules-dir=none fn-search-test.ts
          deno run -A --node-modules-dir=none fn-push-test.ts
          deno run -A --node-modules-dir=none fn-backup-test.ts

  webkit-safety-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 WebKit 及依赖
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps webkit
      - name: Safari 内核的移动端启动、布局与隔离检查
        working-directory: tests
        run: node webkit-smoke.cjs

  local-supabase-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: 使用 Docker 启动完全隔离的本地 Supabase 与 SQL 迁移
        run: bash tests/start-local-storage.sh
      - name: 安装隔离存储测试客户端
        working-directory: tests
        run: npm install --no-save --no-audit --no-fund @supabase/supabase-js
      - name: 真实服务端三账号存储访问回归
        working-directory: tests
        run: node local-storage-real.cjs
      - name: 清理临时本地服务
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/chatter-isolated-supabase/supabase" ]; then
            cd "$RUNNER_TEMP/chatter-isolated-supabase"
            supabase stop --no-backup || true
          fi
