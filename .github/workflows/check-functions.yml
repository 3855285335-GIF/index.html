# 检查两个服务器函数在线上是不是装好了、版本号对不对（只调用不用登录的“ping”，不花任何额度）
# 用法：GitHub 仓库 → Actions（操作）→ check-functions → Run workflow（运行工作流）
name: check-functions
on:
  workflow_dispatch: {}
permissions:
  id-token: write   # 只用来做“别的仓库领不到备份连接”的反向检查
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 搜索函数 chatter-search
        run: |
          curl -sS -m 30 -X POST https://uaoiqbxptnbrvkzjwguc.supabase.co/functions/v1/chatter-search -H 'content-type: application/json' -d '{"op":"ping","probe":"dns"}'; echo
      - name: 推送函数 chatter-push
        run: |
          curl -sS -m 30 -X POST https://uaoiqbxptnbrvkzjwguc.supabase.co/functions/v1/chatter-push -H 'content-type: application/json' -d '{"op":"ping"}'; echo
      - name: 备份函数 chatter-backup 必须拒绝外人（不带身份证明、别的仓库的身份证明都应该被拒）
        run: |
          a=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST https://uaoiqbxptnbrvkzjwguc.supabase.co/functions/v1/chatter-backup)
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=chatter-backup" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value",""))')
          echo "::add-mask::$tok"
          b=$(curl -sS -m 30 -X POST https://uaoiqbxptnbrvkzjwguc.supabase.co/functions/v1/chatter-backup -H "Authorization: Bearer $tok")
          echo "不带身份证明：HTTP $a；别的仓库的身份证明：$b"
          [ "$a" = "401" ] && printf '%s' "$b" | grep -q '"why":"repo"' && ! printf '%s' "$b" | grep -q postgres && echo "两种都被拒绝了 ✅"
