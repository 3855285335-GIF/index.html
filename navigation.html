<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>导航 · Chatter</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="navigation.css?v=20261121a" />
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="navigation.js?v=20261121a"></script>
</head>
<body>
  <div id="map" aria-label="地图"></div>

  <!-- 顶部：返回 + 搜索框；导航中换成转向提示 -->
  <header id="top">
    <button id="back" class="round" aria-label="返回" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <form id="search" role="search" autocomplete="off">
      <svg class="s-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索地点、地址" maxlength="80" enterkeyhint="search" aria-label="搜索地点" />
      <button id="q-clear" type="button" class="bare" aria-label="清除" hidden>×</button>
    </form>
  </header>
  <div id="guide" hidden role="status" aria-live="polite">
    <div id="g-ic" aria-hidden="true"></div>
    <div class="g-txt"><b id="g-dist"></b><span id="g-text"></span></div>
  </div>

  <!-- 右侧按钮 -->
  <div id="side">
    <button id="layer" class="round" aria-label="换成卫星图"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button id="locate" class="round" aria-label="回到我的位置"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" class="fill"/></svg></button>
  </div>
  <p id="banner" role="status" hidden></p>

  <!-- 底部卡片：首页 / 搜索结果 / 地点 / 路线 / 导航中 / 一起导航，同一时间只显示一种 -->
  <section id="sheet" aria-live="polite">
    <div class="grip" aria-hidden="true"></div>
    <div id="v-home" class="v">
      <div id="trip-box" hidden></div>
      <div class="chips" id="chips"></div>
      <div id="recent"></div>
      <p class="credit" id="credit-home"></p>
    </div>
    <div id="v-list" class="v" hidden>
      <div class="v-head"><b id="list-title">搜索结果</b><button class="bare" data-back>关闭</button></div>
      <p id="list-note" class="note"></p>
      <div id="list"></div>
    </div>
    <div id="v-place" class="v" hidden>
      <div class="v-head"><div><b id="p-name"></b><p id="p-addr" class="note"></p></div><button class="bare" data-back>关闭</button></div>
      <div class="acts" id="p-acts"></div>
    </div>
    <div id="v-route" class="v" hidden>
      <div class="v-head"><b id="r-to"></b><button class="bare" data-back>关闭</button></div>
      <div class="modes" id="modes" role="tablist">
        <button data-mode="car" role="tab">驾车</button><button data-mode="bike" role="tab">骑行</button><button data-mode="foot" role="tab">步行</button>
      </div>
      <div id="r-sum"></div>
      <div class="acts"><button id="go" class="solid">开始导航</button><button id="r-steps-btn">路线详情</button></div>
      <ol id="r-steps" hidden></ol>
      <p class="credit">路线：<a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener">FOSSGIS</a>，道路数据 © OpenStreetMap 贡献者</p>
    </div>
    <div id="v-nav" class="v" hidden>
      <div class="nav-sum"><div><b id="n-left"></b><span id="n-eta" class="note"></span></div>
        <div class="acts tight"><button id="n-voice" aria-pressed="true">声音开</button><button id="n-steps">详情</button><button id="n-end" class="danger">结束</button></div></div>
      <p id="n-note" class="note"></p>
      <ol id="n-list" hidden></ol>
    </div>
  </section>

  <!-- 地图服务检查：天地图出不来时一眼看到原因 -->
  <div id="check" class="over" hidden role="dialog" aria-labelledby="check-title">
    <div class="over-box">
      <div class="v-head"><b id="check-title">地图服务检查</b><button class="bare" id="check-close">关闭</button></div>
      <ul id="check-list"></ul>
      <p id="check-tip" class="note"></p>
      <div id="check-raw-wrap" hidden><p class="note">天地图返回的原文（截图发给 AI 就能知道原因）：</p><iframe id="check-raw" title="天地图返回的原文" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <div class="acts"><button id="check-again">重新检查</button><button id="check-show" hidden>看天地图返回的原文</button></div>
    </div>
  </div>
</body>
</html>
